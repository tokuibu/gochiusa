name: Mercari Monitor

on:
  schedule:
    - cron: '*/10 * * * *'

  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run script
        run: python main.py
